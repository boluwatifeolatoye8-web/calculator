<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Calculation</title>
    <style>
        :root {
            color-scheme: dark;
            --navy: #0b1f3a;
            --navy-deep: #07172c;
            --navy-soft: #15365f;
            --sky: #38bdf8;
            --sky-light: #dff4ff;
            --paper: #0b1f3a;
            --panel: #ffffff;
            --muted: #90b6d2;
            --line: rgba(56, 189, 248, 0.18);
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 28px;
            overflow-x: hidden;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #ffffff;
            background:
                radial-gradient(circle at 50% 100%, rgba(56, 189, 248, 0.12), transparent 22rem),
                linear-gradient(145deg, var(--navy-soft) 0%, var(--navy) 48%, var(--navy-deep) 100%);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(rgba(56, 189, 248, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(56, 189, 248, 0.035) 1px, transparent 1px);
            background-size: 36px 36px;
            mask-image: linear-gradient(to bottom, black, transparent 92%);
        }

        .calculator {
            position: relative;
            width: min(400px, calc(100vw - 32px));
            padding: 22px;
            border: 1px solid rgba(56, 189, 248, 0.15);
            border-radius: 32px;
            background: rgba(11, 31, 58, 0.97);
            box-shadow:
                0 38px 90px rgba(3, 11, 24, 0.48),
                0 14px 34px rgba(3, 11, 24, 0.28),
                inset 0 1px 0 rgba(255, 255, 255, 0.055);
            backdrop-filter: blur(20px);
        }

        .calculator::after {
            content: "";
            position: absolute;
            z-index: -1;
            right: -22px;
            bottom: -22px;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: var(--navy-soft);
            opacity: 0.5;
            filter: blur(2px);
        }

        .calculator-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 30px;
            margin: 0 4px 12px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 9px;
            color: #ffffff;
            font-size: 0.71rem;
            font-weight: 800;
            letter-spacing: 0.16em;
        }

        .brand-mark {
            width: 9px;
            height: 9px;
            border-radius: 3px;
            background: var(--sky);
            box-shadow: 12px 0 0 rgba(56, 189, 248, 0.28);
        }

        .mode {
            display: flex;
            align-items: center;
            gap: 7px;
            color: var(--muted);
            font-size: 0.64rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .mode::before {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--sky);
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.18);
        }

        #display {
            width: 100%;
            height: 126px;
            margin: 0 0 16px;
            padding: 32px 22px 20px;
            border: 1px solid var(--line);
            border-radius: 20px;
            outline: none;
            background: var(--navy-deep);
            box-shadow:
                inset 0 3px 10px rgba(3, 11, 24, 0.38),
                0 1px 0 rgba(255, 255, 255, 0.055);
            color: #ffffff;
            font: 650 3rem/1 "SFMono-Regular", Consolas, "Liberation Mono", monospace;
            text-align: right;
            caret-color: transparent;
        }

        #display::placeholder {
            color: var(--muted);
            opacity: 1;
        }

        .keys {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            min-height: 66px;
            border: 1px solid rgba(56, 189, 248, 0.12);
            border-radius: 15px;
            background: var(--navy-soft);
            box-shadow:
                0 6px 14px rgba(3, 11, 24, 0.18),
                inset 0 1px 0 rgba(255, 255, 255, 0.055);
            color: #ffffff;
            font: 700 1.08rem/1 Inter, ui-sans-serif, system-ui, sans-serif;
            cursor: pointer;
            transition: transform 120ms ease, background 160ms ease, box-shadow 160ms ease, border-color 160ms ease;
            -webkit-tap-highlight-color: transparent;
        }

        button:hover {
            background: #1d456f;
            border-color: rgba(56, 189, 248, 0.24);
            box-shadow:
                0 8px 16px rgba(3, 11, 24, 0.24),
                inset 0 1px 0 rgba(255, 255, 255, 0.075);
        }

        button:active {
            transform: translateY(2px) scale(0.98);
            background: #091b31;
            box-shadow: inset 0 2px 5px rgba(3, 11, 24, 0.32);
        }

        button:focus-visible {
            outline: 3px solid rgba(56, 189, 248, 0.30);
            outline-offset: 3px;
        }

        .utility {
            background: #244a70;
            color: #dff4ff;
        }

        .utility:hover {
            background: #2d5a82;
        }

        .operator {
            background: var(--navy);
            border-color: var(--navy);
            color: #ffffff;
            box-shadow:
                0 6px 14px rgba(11, 31, 58, 0.20),
                inset 0 1px 0 rgba(255, 255, 255, 0.13);
        }

        .operator:hover {
            background: var(--navy-soft);
            border-color: var(--navy-soft);
        }

        .equals {
            grid-column: span 2;
            border-color: var(--sky);
            background: linear-gradient(135deg, #79d8fb, var(--sky));
            color: var(--navy);
            font-size: 1.35rem;
            box-shadow:
                0 9px 20px rgba(56, 189, 248, 0.28),
                inset 0 1px 0 rgba(255, 255, 255, 0.28);
        }

        .equals:hover {
            background: linear-gradient(135deg, var(--sky), #0ea5e9);
            border-color: #0ea5e9;
        }

        @media (max-width: 420px) {
            body {
                padding: 12px;
            }

            .calculator {
                width: 100%;
                padding: 16px;
                border-radius: 24px;
            }

            #display {
                height: 112px;
                font-size: 2.25rem;
            }

            .keys {
                gap: 8px;
            }

            button {
                min-height: 58px;
                border-radius: 14px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            button {
                transition: none;
            }
        }
    </style>
</head>
<body>
    <div class="calculator">
        <header class="calculator-header" aria-label="Calculator">
            <div class="brand"><span class="brand-mark"></span>PRECISION</div>
            <div class="mode">Ready</div>
        </header>
        <input type="text" id="display" readonly placeholder="0">
        <div class="keys">
        
            <button class="utility" onclick="clearAll()">C</button>
            <button class="utility" onclick="deleteOne()">DEL</button>
            <button class="operator" onclick="press('%')">%</button>
            <button class="operator" onclick="press('/')">/</button>
            <button onclick="press('7')">7</button>
            <button onclick="press('8')">8</button>
            <button onclick="press('9')">9</button>
            <button class="operator" onclick="press('*')">×</button>
            <button onclick="press('4')">4</button>
            <button onclick="press('5')">5</button>
            <button onclick="press('6')">6</button>
            <button class="operator" onclick="press('-')">−</button>
            <button onclick="press('1')">1</button>
            <button onclick="press('2')">2</button>
            <button onclick="press('3')">3</button>
            <button class="operator" onclick="press('+')">+</button>
           <button onclick="press('0')">0</button>
           <button onclick="press('.')">.</button>
           <button class="equals" onclick="calculate()">=</button>
        </div>
    </div>
    <script>
        let array =[]
        function press(value){
            array.push(value)
            document.getElementById('display').value = array.join("");
        }
        function clearAll(value){
            array=[];
            document.getElementById('display').value =  "";
        }
        function deleteOne(value){
            
            array.pop(value)
            document.getElementById('display').value = array.join("");

        }
        function calculate(){
            let result= eval(array.join(""))
            array[String(result)]
            document.getElementById('display').value = result;

         }
    </script>
</body>
</html>
